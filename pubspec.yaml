name: native_adaptive_ui
description: >-
  Adaptive Flutter widgets that resolve by platform, OS version, and form
  factor — Liquid Glass on iOS 26, Material 3 Expressive on Android 16,
  iPad-aware layouts.
version: 0.1.2
repository: https://github.com/gauravrajkagwaniya/native_adaptive_ui
issue_tracker: https://github.com/gauravrajkagwaniya/native_adaptive_ui/issues
documentation: https://github.com/gauravrajkagwaniya/native_adaptive_ui#readme

topics:
  - ui
  - adaptive
  - cupertino
  - material
  - platform

screenshots:
  - description: >-
      iOS 26 — the floating Liquid Glass tab bar and continuous corners,
      rendered from a real UITabBar.
    path: screenshots/controls_liquid_glass.png
  - description: >-
      Same screen, same code, previewed as iOS 18 — flat Cupertino and a
      pinned tab bar instead of glass.
    path: screenshots/controls_classic.png
  - description: An inset-grouped list with Apple's small-caps section styling.
    path: screenshots/lists_liquid_glass.png
  - description: >-
      iPadOS 26 sidebar navigation, picked automatically for the wider
      window — same widgets, no separate iPad code path.
    path: screenshots/ipad_sidebar.png
  - description: >-
      The example app's own era picker: any DesignEra can be previewed on
      one device, which is how the screenshots above were made.
    path: screenshots/design_era_picker.png

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  # Supplies the CupertinoIcons font. Widgets such as CupertinoListTileChevron
  # draw from it, and without the dependency every one of those glyphs renders
  # as a "?" box in the consuming app.
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.0.1
  flutter:
    sdk: flutter
  # Rasterizes AdaptiveDestination.iconSvgAsset for the native UITabBar — Flutter's
  # own image pipeline has no SVG decoder, and a native UIImage needs raster bytes.
  flutter_svg: ^2.2.1
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.gauravraj.native_adaptive_ui
        pluginClass: NativeAdaptiveUiPlugin
      ios:
        pluginClass: NativeAdaptiveUiPlugin
      macos:
        pluginClass: NativeAdaptiveUiPlugin
